name: Maven Package

on:
  push:
    branches: [ main ]            # Triggers every time you push to 'main'
  workflow_dispatch:     
jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      # Step 1: Download source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: application-service 
      # Step 2: Set up JDK 17 using the chosen distribution
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin' # Alternatives: zulu, adopt, microsoft, corretto
      - name: Verify project files
        run: |         
          ls -la
          echo "Searching for pom.xml:"
          find . -name pom.xml
      - name: Build and Test
        run: mvn -B clean install -f ./pom.xml
